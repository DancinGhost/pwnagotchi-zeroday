name: Build & Publish Canary Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------------------
  # Job 1: Build Embedded Firmwares (ESP32 / ESP32-S3 via PlatformIO)
  # --------------------------------------------------------------------------------------
  build-firmware:
    name: Build Firmware (${{ matrix.target.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - env: m5stick-c
            name: M5StickC / M5StickC Plus
            chip: esp32
            boot_offset: '0x1000'
          - env: m5stick-c-plus2
            name: M5StickC Plus2
            chip: esp32
            boot_offset: '0x1000'
          - env: m5stack-core2
            name: M5Stack Core2
            chip: esp32
            boot_offset: '0x1000'
          - env: t-deck-plus
            name: LILYGO T-Deck Plus
            chip: esp32s3
            boot_offset: '0x0'
          - env: t-deck
            name: LILYGO T-Deck
            chip: esp32s3
            boot_offset: '0x0'
          - env: cyd-esp32-2432s028
            name: CYD ESP32-2432S028 (ILI9341)
            chip: esp32
            boot_offset: '0x1000'
          - env: cyd-esp32-2432s028-2usb
            name: CYD ESP32-2432S028 2USB (ST7789)
            chip: esp32
            boot_offset: '0x1000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO & esptool
        run: |
          pip install "platformio==6.1.16" "esptool==4.8.1"
          echo "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"
          pio --version
          esptool.py version

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.target.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.target.env }}-

      - name: Build firmware for ${{ matrix.target.env }}
        run: |
          pio run -e ${{ matrix.target.env }}

      - name: Generate merged factory binary and package zip
        run: |
          set -euo pipefail
          ENV_DIR=".pio/build/${{ matrix.target.env }}"
          DIST_DIR="dist/${{ matrix.target.env }}"
          mkdir -p "$DIST_DIR"

          # Copy core raw binaries
          cp "$ENV_DIR/firmware.bin" "$DIST_DIR/firmware.bin"
          cp "$ENV_DIR/bootloader.bin" "$DIST_DIR/bootloader.bin"
          cp "$ENV_DIR/partitions.bin" "$DIST_DIR/partitions.bin"

          # Resolve boot_app0.bin deterministically from the pinned Arduino-ESP32 package
          FACTORY_BIN="$DIST_DIR/pwnagotchi-zd-${{ matrix.target.env }}-factory.bin"
          MERGE_ARGS=(
            --chip "${{ matrix.target.chip }}" merge_bin
            -o "$FACTORY_BIN"
            "${{ matrix.target.boot_offset }}" "$ENV_DIR/bootloader.bin"
            0x8000 "$ENV_DIR/partitions.bin"
          )
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          if [ -f "$BOOT_APP0" ]; then
            MERGE_ARGS+=(0xe000 "$BOOT_APP0")
          fi
          MERGE_ARGS+=(0x10000 "$ENV_DIR/firmware.bin")
          esptool.py "${MERGE_ARGS[@]}"

          # Include cross-platform one-click flashing utilities explicitly (no __pycache__)
          for f in flash.py flash.sh flash.bat; do
            if [ -f "scripts/flasher/$f" ]; then
              cp "scripts/flasher/$f" "$DIST_DIR/"
            fi
          done
          if [ -f "docs/FLASHING.md" ]; then
            cp docs/FLASHING.md "$DIST_DIR/"
          fi
          # License compliance: ship our license + third-party notices with the binaries
          cp LICENSE THIRD_PARTY_NOTICES.md "$DIST_DIR/"

          # Create zip archive
          ZIP_NAME="pwnagotchi-zd-${{ matrix.target.env }}.zip"
          (cd "$DIST_DIR" && zip -r "../../$ZIP_NAME" ./*)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.target.env }}
          path: pwnagotchi-zd-${{ matrix.target.env }}.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------------------
  # Job 2: Build Linux Desktop & CLI Binaries (x86_64)
  # --------------------------------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev qt6-base-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Linux targets
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Run automated test suite
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package Linux binaries
        run: |
          set -euo pipefail
          DIST_DIR="dist/linux-x86_64"
          mkdir -p "$DIST_DIR/bin"
          cp build/zd-linux "$DIST_DIR/bin/"
          cp build/zd-gui "$DIST_DIR/bin/"
          cp build/zd_sim "$DIST_DIR/bin/"
          cp README.md "$DIST_DIR/"
          cp LICENSE "$DIST_DIR/"
          cp THIRD_PARTY_NOTICES.md "$DIST_DIR/"
          cp docs/LINUX.md "$DIST_DIR/"

          TAR_NAME="pwnagotchi-zd-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C dist/linux-x86_64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: pwnagotchi-zd-linux-x86_64.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------------------
  # Job 3: Package Web Pocket Cyberdeck
  # --------------------------------------------------------------------------------------
  build-web:
    name: Package Web Cyberdeck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Web & C++ parity tests
        run: |
          node platforms/web/test_web_core.js

      - name: Package Web build
        run: |
          ZIP_NAME="pwnagotchi-zd-web.zip"
          cd platforms/web
          zip -r "../../$ZIP_NAME" index.html styles.css js/
          cd ../..
          zip -j "$ZIP_NAME" LICENSE THIRD_PARTY_NOTICES.md

      - name: Upload Web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-cyberdeck
          path: pwnagotchi-zd-web.zip
          if-no-files-found: error

  # --------------------------------------------------------------------------------------
  # Job 4: Collate Artifacts, Checksum, and Publish Canary Release
  # --------------------------------------------------------------------------------------
  publish-canary:
    name: Publish Canary Release
    needs: [build-firmware, build-linux, build-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create or Update Canary Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: canary
          name: "pwnagotchi-zeroday Canary Release"
          body: |
            Automated multi-platform canary build of **pwnagotchi-zeroday** from branch `main`.

            ### Included Artifacts
            - **LILYGO T-Deck Plus**: `pwnagotchi-zd-t-deck-plus.zip` (ESP32-S3, 320x240 ST7789, Touch, Keyboard, GPS)
            - **LILYGO T-Deck**: `pwnagotchi-zd-t-deck.zip` (Standard T-Deck)
            - **CYD ESP32-2432S028 (Classic ILI9341)**: `pwnagotchi-zd-cyd-esp32-2432s028.zip` (ESP32, 2.8" 320x240 ILI9341, XPT2046 Touch)
            - **CYD ESP32-2432S028 2USB (ST7789)**: `pwnagotchi-zd-cyd-esp32-2432s028-2usb.zip` (ESP32, dual-USB 2.8" 320x240 ST7789, XPT2046 Touch)
            - **M5StickC / M5StickC Plus**: `pwnagotchi-zd-m5stick-c.zip`
            - **M5StickC Plus2**: `pwnagotchi-zd-m5stick-c-plus2.zip`
            - **M5Stack Core2**: `pwnagotchi-zd-m5stack-core2.zip`
            - **Linux x86_64 Desktop & TUI**: `pwnagotchi-zd-linux-x86_64.tar.gz` (`zd-linux`, `zd-gui`, `zd_sim`)
            - **Web Pocket Cyberdeck**: `pwnagotchi-zd-web.zip` (HTML5 Canvas simulator)

            ### How to Flash Embedded Devices
            - **In-Browser Web Flasher**: Connect your board to Chrome/Edge and open [Espressif Web Flasher](https://espressif.github.io/esptool-js/), choose baud rate `921600`, select offset `0x0000`, and flash `pwnagotchi-zd-*-factory.bin`!
            - **One-Click Script**: Extract the board's zip and run `./flash.sh` (Linux/macOS) or `flash.bat` (Windows).
            - For detailed instructions, see [FLASHING.md](https://github.com/DancinGhost/pwnagotchi-zeroday/blob/main/docs/FLASHING.md).
          files: release-assets/*
          prerelease: true
          draft: false
