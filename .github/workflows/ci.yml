name: CI (Host Tests, Sanitizers, Linux Build, Firmware & Web Parity)

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Host Tests, Linux Targets & Web Parity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev qt6-base-dev

      - name: Run Make host tests & Web JS parity checks
        run: |
          make all
          make test
          make linux
          make demo

      - name: Build CMake targets (including Qt6 GUI) & run CTest
        run: |
          cmake -B build_cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cmake --config Release -j$(nproc)
          test -x build_cmake/zd-gui
          ctest --test-dir build_cmake --output-on-failure

  sanitizers:
    name: ASan + UBSan Host Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev

      - name: Build & run tests with AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          cmake -B build_san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_san --target test_functional_core test_painter test_secops test_linux_parsers test_dot11_frames test_linux_shell -j$(nproc)
          ctest --test-dir build_san --output-on-failure

  firmware-compile-check:
    name: ESP32 Firmware Compile Check (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - m5stick-c
          - cyd-esp32-2432s028
          - t-deck-plus
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install "platformio==6.1.16"
          echo "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Compile firmware
        run: pio run -e ${{ matrix.env }}
