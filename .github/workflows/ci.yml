name: CI (Host Tests, Sanitizers, Linux Build, Firmware & Web Parity)

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Host Tests, Linux Targets & Web Parity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev qt6-base-dev

      - name: Run Make host tests & Web JS parity checks
        run: |
          make all
          make test
          make linux
          make demo

      - name: Build CMake targets (including Qt6 GUI) & run CTest
        run: |
          cmake -B build_cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cmake --config Release -j$(nproc)
          test -x build_cmake/zd-gui
          QT_QPA_PLATFORM=offscreen ctest --test-dir build_cmake --output-on-failure

  sanitizers:
    name: ASan + UBSan Host Test Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev

      - name: Build & run tests with AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: |
          cmake -B build_san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_san --target test_functional_core test_painter test_secops test_linux_parsers test_dot11_frames test_linux_shell test_esp32_common zd_sim zd-linux -j$(nproc)
          ctest --test-dir build_san -E "^linux_gui_tests$" --output-on-failure

  security-audit:
    name: Static Analysis, Supply-Chain & Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck python3-pip
          python3 -m pip install --break-system-packages pip-audit

      - name: Run C++ static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,portability --error-exitcode=1 \
            --suppress=missingIncludeSystem --suppress=unmatchedSuppression --quiet \
            -I core/include -I render/include -I platforms/linux/backend -I platforms/linux/app -I platforms/common \
            core render platforms/common platforms/linux platforms/native

      - name: Audit flasher runtime dependency (esptool==4.8.1) & scan for accidental secrets
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, sys
          bad = []
          pat = re.compile(r"-----BEGIN (?:RSA|EC|OPENSSH|PGP|DSA) PRIVATE KEY-----")
          for p in pathlib.Path(".").rglob("*"):
              if ".git" in p.parts or not p.is_file():
                  continue
              try:
                  txt = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if pat.search(txt):
                  bad.append(str(p))
          if bad:
              print("Private key material detected in:", bad)
              sys.exit(1)
          print("Secret pattern scan clean.")
          PY
          echo "esptool==4.8.1" > /tmp/flasher-req.txt
          pip-audit -r /tmp/flasher-req.txt

  firmware-compile-check:
    name: ESP32 Firmware Compile Check (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env:
          - m5stick-c
          - m5stick-c-plus2
          - m5stack-core2
          - cyd-esp32-2432s028
          - cyd-esp32-2432s028-2usb
          - t-deck-plus
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install "platformio==6.1.16"
          echo "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Compile firmware
        run: pio run -e ${{ matrix.env }}
