; PlatformIO Multi-Device Configuration
; pwnagotchi-zeroday — Portable C++17 Functional Core + Multi-Platform Hardware Shells

[platformio]
default_envs = m5stick-c
src_dir = platforms
include_dir = core/include

; Active offense (ESP32 deauthentication injection) is compiled into EVERY ESP32 build and
; gated at RUNTIME only (like the Linux target): the radio stays silent until the operator
; arms + allow-lists a specific BSSID at the serial `sec` console. Use only for authorized
; assessment of networks you own or have written permission to test. See docs/OFFENSIVE.md.

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Icore/include
    -Irender/include
    -Iplatforms/common
    ; Nothing in this codebase throws/catches (the functional core reports failure via
    ; return values, never exceptions) or uses dynamic_cast/typeid, so both are pure
    ; overhead here: disabling them removes exception-unwind tables and RTTI metadata
    ; from every one of our own translation units (and from M5GFX/M5Unified, which are
    ; built from source for this project), with no change in behavior.
    -fno-exceptions
    -fno-rtti
    ; Wrap ONLY ieee80211_raw_frame_sanity_check so crafted management frames from
    ; platforms/common/esp32_offensive.hpp reach the PHY while preserving full linker
    ; duplicate-symbol checking across the rest of the firmware.
    -Wl,--wrap=ieee80211_raw_frame_sanity_check
esp_lib_deps =
    Preferences
    WiFi
    SPI
m5_lib_deps =
    ${common.esp_lib_deps}
    m5stack/M5Unified @ 0.2.2
; The stock Arduino-ESP32 "default" partition table reserves half of flash for a second
; OTA slot (app0 + app1, ~1.3MB each). This project has no OTA update code, so that
; reservation is pure waste; huge_app.csv instead gives one ~3MB app partition (the
; standard scheme for exactly this "sketch too big" situation), sized to fit a 4MB chip.
m5_partitions = huge_app.csv
platform_idf5 = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip

; Toolchain Note:
; All embedded targets pin `platform = espressif32 @ 6.9.0` (ESP-IDF 4.4 / Arduino-ESP32 2.x)
; by default, with parallel `*-idf5` environments targeting Arduino-ESP32 3.x / ESP-IDF 5.x
; via PIOArduino (`platform_idf5`). `platforms/common/esp32_hal.hpp` handles 2.x/3.x BLE/WiFi
; API differences with `#if ESP_ARDUINO_VERSION_MAJOR >= 3` guards.

; M5StickC (160x80) and M5StickC Plus (240x135) via M5Unified auto-detection
[env:m5stick-c]
platform = espressif32 @ 6.9.0
board = m5stick-c
framework = arduino
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5StickC Plus2 (ESP32-PICO-V3-02, 8MB Flash, 240x135)
[env:m5stick-c-plus2]
platform = espressif32 @ 6.9.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5Stack Core2 (320x240 QVGA, 3 touch buttons — uses wide layout & Button C prev-theme)
[env:m5stack-core2]
platform = espressif32 @ 6.9.0
board = m5stack-core2
framework = arduino
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; LILYGO T-Deck Plus / Portable Plus (ESP32-S3FN16R8, 16MB Flash, 8MB OPI PSRAM,
; 320x240 ST7789 IPS LCD, GT911 Capacitive Touch, Trackball, QWERTY Keyboard,
; Battery ADC Monitor, Peripheral Power Gate, MIA-M10Q GNSS / GPS)
[env:t-deck-plus]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<tdeck/*>
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    ${common.esp_lib_deps}
    SD
    lovyan03/LovyanGFX @ 1.2.0

; Standard LILYGO T-Deck alias
[env:t-deck]
extends = env:t-deck-plus

; Opt-in LoRa build: T-Deck + SX1262 peer transceiver (platforms/common/esp32_lora_peer.hpp).
; Compiled off by default (the SX1262 shares the LCD/SD SPI bus and LoRa freq is region-specific),
; so the whole RadioLib driver is gated behind -DZD_WITH_LORA and only this env pulls RadioLib.
; Override the region frequency with e.g. -DZD_LORA_FREQ=868.0 (EU) / 433.0.
[env:t-deck-lora]
extends = env:t-deck-plus
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DZD_WITH_LORA
lib_deps =
    ${common.esp_lib_deps}
    SD
    lovyan03/LovyanGFX @ 1.2.0
    jgromes/RadioLib @ 6.6.0

; Sunton CYD — ESP32-2432S028R ("Cheap Yellow Display", classic single Micro-USB,
; ESP32-WROOM-32 4MB Flash, 2.8" 320x240 ILI9341 TFT on HSPI, XPT2046 Resistive Touch)
[env:cyd-esp32-2432s028]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<cyd/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps =
    ${common.esp_lib_deps}
    lovyan03/LovyanGFX @ 1.2.0

; Sunton CYD — ESP32-2432S028R 2USB variant (Micro-USB + USB-C, 2.8" 320x240 ST7789 TFT)
[env:cyd-esp32-2432s028-2usb]
extends = env:cyd-esp32-2432s028
build_flags =
    ${common.build_flags}
    -DZD_CYD_PANEL_ST7789=1

; Parallel Arduino-ESP32 3.x / ESP-IDF 5.x (PIOArduino) environments
[env:m5stick-c-idf5]
extends = env:m5stick-c
platform = ${common.platform_idf5}
board_build.variant = m5stack_stickc
lib_ldf_mode = deep

[env:m5stick-c-plus2-idf5]
extends = env:m5stick-c-plus2
platform = ${common.platform_idf5}
board_build.variant = m5stack_stickc_plus2
lib_ldf_mode = deep

[env:m5stack-core2-idf5]
extends = env:m5stack-core2
platform = ${common.platform_idf5}
lib_ldf_mode = deep

[env:t-deck-plus-idf5]
extends = env:t-deck-plus
platform = ${common.platform_idf5}
lib_ldf_mode = deep

[env:cyd-esp32-2432s028-idf5]
extends = env:cyd-esp32-2432s028
platform = ${common.platform_idf5}
lib_ldf_mode = deep

; Desktop / Linux / Raspberry Pi native simulator target
[env:native]
platform = native
build_src_filter = -<*> +<native/*>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Icore/include
    -Irender/include
    -Iplatforms/common
